<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DoPick Admin</title><link rel="stylesheet" href="/assets/styles.css"></head><body class="admin-body"><header class="top"><a class="brand" href="/"><span class="logo">D</span><span><b>DoPick Admin</b><small>상품 · 요청 관리</small></span></a></header><main class="admin-wrap"><section class="panel" id="loginBox"><h2>관리자 접속</h2><p class="muted">Cloudflare 환경변수 ADMIN_KEY와 같은 값을 입력하세요.</p><div class="inline"><input id="adminKey" type="password" placeholder="관리자 키"><button class="btn" id="loginBtn">접속</button></div><p id="loginMsg" class="form-msg"></p></section><section id="adminArea" class="hidden"><div class="admin-grid"><form id="productForm" class="panel"><h2>상품 등록</h2><label>상품명<input name="name" required></label><label>가격<input name="price" type="number"></label><label>카테고리<select id="categorySelect"><option value="">카테고리 선택</option><option value="__new__">+ 새 카테고리 추가</option></select></label><label id="newCategoryWrap" class="hidden">새 카테고리<input id="newCategory" placeholder="예: 아기용품"></label><label>태그<input name="tags" placeholder="부모님, 건강, 5만원 이하"></label><label>쿠팡 파트너스 링크<input name="affiliate_url" required></label><label>썸네일 URL<input name="thumbnail_url" placeholder="상품 이미지 URL"></label><label>짧은 설명<textarea name="description" rows="3"></textarea></label><label class="check"><input name="featured" type="checkbox"> 추천 상품</label><button class="btn" type="submit">상품 등록</button><p id="productMsg"></p></form><div class="panel"><div class="section-head"><h2>등록 상품</h2><div class="inline"><select id="productCategoryFilter" aria-label="등록 상품 카테고리 필터"><option value="">전체 카테고리</option></select><button class="btn secondary" id="reloadProducts">새로고침</button></div></div><div id="adminProducts" class="admin-list"></div></div></div><section class="panel requests"><div class="section-head"><h2>요청함</h2><button class="btn secondary" id="reloadRequests">새로고침</button></div><div id="adminRequests" class="admin-list"></div></section></section></main><script src="/assets/admin.js"></script></body></html>
